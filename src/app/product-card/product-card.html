<!-- child -->
<div class="product-card">
  <div class="card h-100">
    <div class="category-badge">{{ product().category }}</div>
    <a [routerLink]="['/product', product().id]">
      <img [src]="product().image" class="card-img-top pro-img" alt="Product" />
    </a>

    <div class="card-body">
      <h5 class="card-title product-title">{{ product().title }}</h5>
      <div class="price-row">
        <span class="price">{{ product().price | currency }}</span>
        <span class="price-khr">{{ product().price | toKHR }}</span>
      </div>
      <h6 class="card-title product-description">{{ product().description }}</h6>
      <button class="add-button" (click)="addToCart()">
        Add to cart <i class="bi bi-arrow-right"></i>
      </button>
    </div>
  </div>
</div>
