<main class="home-page container py-4 py-lg-5">
  <app-slider></app-slider>

  <div class="section-heading">
    <div>
      <p class="eyebrow">Curated for you</p>
      <h1>Find something <em>beautiful.</em></h1>
    </div>
    <a routerLink="/product-page" class="view-all">View all products <i class="bi bi-arrow-up-right"></i></a>
  </div>

  @if (loading()) {
    <div class="product-grid skeleton-grid" role="status" aria-label="Loading products" aria-busy="true">
      @for (card of skeletonCards; track $index) {
        <div class="skeleton-card" aria-hidden="true">
          <span class="skeleton-media"></span>
          <div class="skeleton-content">
            <span class="skeleton-line skeleton-line--title"></span>
            <span class="skeleton-line skeleton-line--price"></span>
            <span class="skeleton-line skeleton-line--copy"></span>
            <span class="skeleton-line skeleton-line--button"></span>
          </div>
        </div>
      }
    </div>
  } @else if (errorMessage()) {
    <p class="text-center py-5 text-danger">{{ errorMessage() }}</p>
  } @else {
    <div class="product-grid">
      @for (item of products(); track item.id) {
        <app-product-card [product]="item"></app-product-card>
      }
    </div>
  }
  </main>
