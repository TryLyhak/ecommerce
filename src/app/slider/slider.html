<div id="carouselExampleCaptions" class="carousel slide shop-hero">
  <div class="carousel-indicators">
    <button
      type="button"
      data-bs-target="#carouselExampleCaptions"
      data-bs-slide-to="0"
      class="active"
      aria-current="true"
      aria-label="Slide 1"
    ></button>
    <button
      type="button"
      data-bs-target="#carouselExampleCaptions"
      data-bs-slide-to="1"
      aria-label="Slide 2"
    ></button>
    <button
      type="button"
      data-bs-target="#carouselExampleCaptions"
      data-bs-slide-to="2"
      aria-label="Slide 3"
    ></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="/pic1.avif" class="d-block w-100" alt="Featured products" />
      <div class="carousel-caption d-none d-md-block">
        <p class="hero-kicker">New season, new mood</p>
        <h5>Small details.<br /><em>Big delight.</em></h5>
        <p>Thoughtful finds for everyday living, curated just for you.</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="/pic2.jpg" class="d-block w-100" alt="New collection" />
      <div class="carousel-caption d-none d-md-block">
        <h5>Made to be <em>loved.</em></h5>
        <p>Discover pieces that bring a little more joy to your routine.</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="/pic1.avif" class="d-block w-100" alt="Seasonal collection" />
      <div class="carousel-caption d-none d-md-block">
        <h5>Your next favorite<br /><em>is waiting.</em></h5>
        <p>Explore our handpicked collection today.</p>
      </div>
    </div>
  </div>
  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#carouselExampleCaptions"
    data-bs-slide="prev"
  >
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#carouselExampleCaptions"
    data-bs-slide="next"
  >
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
